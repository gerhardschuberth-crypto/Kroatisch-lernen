<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kroatisch für den Urlaub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#0e2a35; --muted:#5a707a; --line:#cdd9d6;
  --accent:#0f5c78; --on-accent:#ffffff; --red:#c9302c; --ok:#2e7d5b; --bad:#b3342f;
  --soft:#e1ebe8;
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1b22; --surface:#10272f; --ink:#e8f1f2; --muted:#8fa8b0; --line:#1f3a44;
    --accent:#5cc0e0; --on-accent:#06222c; --red:#ef6b5f; --ok:#6fd0a0; --bad:#f08a78;
    --soft:#143039;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1b22; --surface:#10272f; --ink:#e8f1f2; --muted:#8fa8b0; --line:#1f3a44;
  --accent:#5cc0e0; --on-accent:#06222c; --red:#ef6b5f; --ok:#6fd0a0; --bad:#f08a78;
  --soft:#143039;
  color-scheme: dark;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
*{ box-sizing:border-box; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size:17px; line-height:1.45; padding-bottom:92px; -webkit-tap-highlight-color:transparent;
}
button{ font:inherit; color:inherit; cursor:pointer; }
.wrap{ max-width:640px; margin:0 auto; padding:0 16px; }
h1,h2,h3{ font-family:'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif; margin:0; line-height:1.05; letter-spacing:-0.01em; }

/* Hero */
.hero{ padding:22px 0 8px; }
.hello{
  all:unset; display:block; cursor:pointer;
  font-family:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif; font-weight:800;
  font-size:clamp(52px, 17vw, 96px); line-height:.92; letter-spacing:-0.03em; color:var(--accent);
}
.checker{
  height:16px; width:100%; margin:14px 0 12px; border-radius:2px;
  background:
    conic-gradient(var(--red) 25%, transparent 0 50%, var(--red) 0 75%, transparent 0) 0 0/16px 16px;
  border:1px solid var(--red);
}
.lede{ margin:0; color:var(--muted); max-width:34ch; }

/* Buttons */
.btn{
  border:2px solid var(--ink); background:transparent; border-radius:8px; padding:12px 16px;
  font-weight:700; min-height:48px;
}
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn.again{ border-color:var(--red); color:var(--red); }
.btn.block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:default; }
.btn.big{ min-height:72px; font-size:20px; }
.field{ display:block; margin-top:14px; }
.field span{ display:block; font-weight:700; margin-bottom:4px; }
.field select{ width:100%; border:2px solid var(--ink); background:var(--surface); color:var(--ink); border-radius:8px; padding:12px; font:inherit; min-height:48px; }
.check{ display:flex; gap:10px; align-items:center; margin-top:16px; min-height:44px; }
.check input{ width:24px; height:24px; accent-color:var(--accent); }
.btn:focus-visible, .topic:focus-visible, .item:focus-visible, .opt:focus-visible, nav button:focus-visible, .hello:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.row > .btn{ flex:1 1 150px; }
.back{ all:unset; cursor:pointer; color:var(--accent); font-weight:700; padding:14px 0 6px; display:inline-block; }
.back:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

/* segmented */
.seg{ display:flex; border:2px solid var(--ink); border-radius:8px; overflow:hidden; margin:16px 0 4px; }
.seg button{ flex:1; border:0; background:transparent; padding:10px 8px; font-weight:700; min-height:44px; }
.seg button.on{ background:var(--ink); color:var(--bg); }

.sec-title{ font-size:24px; margin:26px 0 10px; }
.overall{ margin-top:18px; }
.bar{ display:block; height:8px; background:var(--soft); border-radius:4px; overflow:hidden; margin-top:6px; }
.bar u{ display:block; height:100%; background:var(--ok); text-decoration:none; }
.small{ font-size:14px; color:var(--muted); }

/* topics */
.topics{ display:grid; grid-template-columns:1fr; gap:10px; }
@media (min-width:560px){ .topics{ grid-template-columns:1fr 1fr; } }
.topic{
  display:flex; gap:12px; align-items:center; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--line); border-left:8px solid var(--c, var(--accent));
  border-radius:4px 12px 12px 4px; padding:12px 14px;
}
.topic .ico{ font-size:30px; width:38px; text-align:center; }
.topic .tt{ flex:1; min-width:0; }
.topic b{ display:block; font-family:'Bricolage Grotesque',system-ui,sans-serif; font-size:19px; line-height:1.15; }
.topic small{ color:var(--muted); font-size:14px; }

/* list items */
.list{ margin-top:14px; border-top:1px solid var(--line); }
.item{
  display:flex; gap:10px; align-items:flex-start; justify-content:space-between; padding:12px 2px;
  border-bottom:1px solid var(--line); cursor:pointer;
}
.item .hr{ font-weight:700; font-size:18px; }
.item .de{ color:var(--ink); }
.item .pron{ color:var(--muted); font-size:14px; }
.item .note{ color:var(--muted); font-size:14px; font-style:italic; }
.tick{ color:var(--ok); font-weight:700; margin-left:6px; }
.chip{ display:inline-block; font-size:13px; padding:1px 8px; border-radius:10px; background:var(--soft); color:var(--muted); margin-top:2px; }
.speak{
  flex:none; width:44px; height:44px; border-radius:50%; border:2px solid var(--accent);
  background:transparent; font-size:18px; line-height:1; display:grid; place-items:center;
}

/* flashcard */
.progress-line{ display:flex; justify-content:space-between; font-size:14px; color:var(--muted); margin-top:10px; }
.flash{
  margin-top:12px; background:var(--surface); border:2px solid var(--ink); border-radius:6px 22px 6px 22px;
  min-height:300px; padding:18px 18px 20px; display:flex; flex-direction:column; cursor:pointer; position:relative;
}
.flash .top{ display:flex; justify-content:space-between; align-items:center; min-height:44px; }
.flash .tag{ font-size:14px; color:var(--muted); }
.flash .main{ font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:700; font-size:clamp(28px,8vw,40px); line-height:1.12; margin:14px 0 6px; overflow-wrap:anywhere; }
.flash .back-side{ border-top:2px dashed var(--line); margin-top:14px; padding-top:14px; }
.flash .ans{ font-size:clamp(22px,6.5vw,30px); font-weight:700; color:var(--accent); line-height:1.2; overflow-wrap:anywhere; }
.flash .hint{ margin-top:auto; color:var(--muted); font-size:14px; padding-top:16px; }
.flash .pron{ color:var(--muted); margin-top:6px; }
.flash .note{ margin-top:8px; font-style:italic; color:var(--muted); }
.stack{ display:grid; gap:10px; margin-top:14px; }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }

/* quiz */
.qprompt{ margin-top:12px; background:var(--surface); border:2px solid var(--ink); border-radius:6px 22px 6px 22px; padding:18px; display:flex; gap:10px; justify-content:space-between; align-items:flex-start; }
.qprompt .main{ font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:700; font-size:clamp(24px,7vw,34px); line-height:1.15; overflow-wrap:anywhere; }
.opts{ display:grid; gap:10px; margin-top:14px; }
.opt{ text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:10px; padding:14px; font-weight:500; min-height:52px; }
.opt.right{ border-color:var(--ok); background:color-mix(in srgb, var(--ok) 16%, var(--surface)); }
.opt.wrong{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.result-num{ font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:800; font-size:72px; line-height:1; color:var(--accent); margin:24px 0 8px; }

/* dialogs */
.bubble{ max-width:88%; padding:12px 14px; border-radius:16px; margin:10px 0; display:flex; gap:8px; align-items:flex-start; justify-content:space-between; }
.bubble.v{ background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px; }
.bubble.i{ background:var(--accent); color:var(--on-accent); margin-left:auto; border-bottom-right-radius:4px; }
.bubble.i .speak{ border-color:var(--on-accent); }
.bubble .who{ font-size:13px; opacity:.75; }
.bubble .hr{ font-weight:700; }
.bubble .de{ font-size:15px; opacity:.85; margin-top:2px; }

/* search */
.search{ width:100%; border:2px solid var(--ink); background:var(--surface); color:var(--ink); border-radius:8px; padding:13px 14px; font:inherit; margin-top:12px; }
.search:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

/* abc */
table{ width:100%; border-collapse:collapse; margin-top:10px; }
th,td{ text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
th{ font-size:14px; color:var(--muted); font-weight:500; }
td.ch{ font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:800; font-size:22px; color:var(--accent); white-space:nowrap; }
.tip{ background:var(--surface); border-left:6px solid var(--accent); padding:10px 14px; border-radius:2px 10px 10px 2px; margin:10px 0; }
.scroll-x{ overflow-x:auto; }

/* nav */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
nav .in{ max-width:640px; margin:0 auto; display:flex; gap:4px; }
nav button{ flex:1; border:0; background:transparent; border-radius:10px; padding:6px 4px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:13px; color:var(--muted); min-height:52px; }
nav button .e{ font-size:20px; line-height:1; }
nav button.on{ color:var(--accent); background:var(--soft); font-weight:700; }

#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom, 0px)); z-index:30;
  background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:10px; max-width:90%; font-size:14px; display:none; text-align:center;
}
@media (prefers-reduced-motion: no-preference){
  .flash{ transition:border-color .15s; }
}
</style>
</head>

 ['z','weiches „s“ wie in Sonne','zrelo (reif)','SRE-lo'],
 ['s','scharfes „s“ wie in Haus','sol (Salz)','sol'],
 ['r','gerolltes Zungenspitzen-R','Hrvatska (Kroatien)','CHR-wat-ska']
];

/* ---------- Hilfsfunktionen ---------- */
const ALL = CATS.flatMap(cat => cat.cards.map(c => ({cat, hr:c[0], de:c[1], pron:c[2]||'', note:c[3]||'', key:cat.id+'|'+c[0]})));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = s => s.toLowerCase().replace(/đ/g,'d').replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const DAY_MS = 86400000;
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*60000) / DAY_MS); };
const INTERVALS = [1,3,7,16,35];
const PLAN = ['zahlen','richtung','basis','markt','super','resto','gemuese','fisch','vorrat','koch','keto','spez','camp','kalender','farben','alltag','flirt'];
let srs = {};
try{ const raw = localStorage.getItem('hr-srs-v1'); const p = raw ? JSON.parse(raw) : {}; if(p && typeof p==='object') srs = p; }catch(e){ srs = {}; }
function save(){ try{ localStorage.setItem('hr-srs-v1', JSON.stringify(srs)); }catch(e){} }
try{
  const old = localStorage.getItem('hr-known-v1');
  if(old){ const p = JSON.parse(old); for(const k in p){ if(p[k] && !srs[k]) srs[k] = { b:1, d:today()+1 }; } save(); localStorage.removeItem('hr-known-v1'); }
}catch(e){}
const known = new Proxy({}, { get: (t, k) => !!srs[k] });
function learn(c){
  const t = today(), r = srs[c.key];
  if(!r){ srs[c.key] = { b:1, d:t+INTERVALS[0] }; }
  else if(r.d <= t){ r.b = Math.min(r.b+1, 5); r.d = t + INTERVALS[r.b-1]; }
  save();
}
function lapse(c, dueNow){
  const r = srs[c.key]; if(!r) return;
  r.b = 1; r.d = today() + (dueNow ? 0 : 1); save();
}
function dueCards(){
  const t = today();
  return ALL.filter(c => srs[c.key] && srs[c.key].d <= t).sort((a,b) => srs[a.key].d - srs[b.key].d);
}
const PRIORITY = ['alltag|Žao mi je, nažalost ne razumijem hrvatski', 'alltag|Šalim se! Učim hrvatski', 'alltag|Ja sam Gerhard Veličanstveni i dolazim iz prekrasnog Melka u dolini Wachau u Austriji'];
function newCards(n){
  const ordered = PLAN.flatMap(id => ALL.filter(c => c.cat.id===id));
  const first = PRIORITY.map(k => ordered.find(c => c.key===k)).filter(Boolean);
  return [...first, ...ordered.filter(c => !PRIORITY.includes(c.key))].filter(c => !srs[c.key]).slice(0, n);
}
const catCards = id => ALL.filter(c => c.cat.id===id);
const knownCount = list => list.filter(c => known[c.key]).length;

/* ---------- Sprachausgabe ---------- */
let hrVoice = null, warned = false;
function loadVoices(){
  try{
    const vs = speechSynthesis.getVoices();
    hrVoice = vs.find(v => /^hr/i.test(v.lang)) || vs.find(v => /^(bs|sr)/i.test(v.lang)) || null;
  }catch(e){ hrVoice = null; }
}
if('speechSynthesis' in window){ loadVoices(); try{ speechSynthesis.addEventListener('voiceschanged', loadVoices); }catch(e){} }
function makeUtt(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'hr-HR';
  u.rate = 0.85;
  u.onerror = e => {
    const err = e && e.error;
    if(err && err!=='canceled' && err!=='interrupted'){ toast('Sprachausgabe nicht möglich (' + err + '). Bitte die Seite direkt in Chrome öffnen.'); }
  };
  return u;
}
function stopSpeech(){
  try{ if(speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); } }catch(e){}
}
function speak(text){
  if(!('speechSynthesis' in window)){ toast('In diesem Browser gibt es keine Sprachausgabe. Bitte die Seite direkt in Chrome öffnen.'); return; }
  loadVoices();
  let n = 0; try{ n = speechSynthesis.getVoices().length; }catch(e){}
  if(n>0 && !hrVoice && !warned){ warned = true; toast('Keine kroatische Stimme gefunden. Die Aussprache kann ungenau sein.'); }
  try{
    stopSpeech(); speechSynthesis.resume();
    setTimeout(() => { try{ speechSynthesis.speak(makeUtt(text)); }catch(e){} }, 80);
  }catch(e){}
}
function speakAll(texts){
  if(!('speechSynthesis' in window)) return;
  try{
    stopSpeech(); speechSynthesis.resume();
    setTimeout(() => { try{ texts.forEach(t => speechSynthesis.speak(makeUtt(t))); }catch(e){} }, 80);
  }catch(e){}
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.style.display='none'; }, 5000);
}

function viewHome(){
  const total = ALL.length, done = knownCount(ALL);
  const t = today(), due = dueCards().length, left = newCards(1000).length;
  let nextDay = null; for(const k in srs){ const d = srs[k].d; if(d>t && (nextDay===null || d<nextDay)) nextDay = d; }
  const todayInfo = due>0 ? 'Fällige Karten zuerst, dann neue Karten.'
    : nextDay===null ? `Fang heute mit ${S.newN} neuen Karten an.`
    : `Heute ist nichts fällig. Nächste Wiederholung ${nextDay-t===1?'morgen':'in '+(nextDay-t)+' Tagen'}.`;
  const topics = CATS.map(cat => {
    const cs = catCards(cat.id), k = knownCount(cs);
    return `<button class="topic" style="--c:${cat.color}" data-action="open-cat" data-id="${cat.id}">
      <span class="ico">${cat.icon}</span>
      <span class="tt"><b>${esc(cat.title)}</b><small>${cs.length} Karten, ${k} gelernt</small>

  return `<section class="hero">

    <div class="checker" aria-hidden="true"></div>
    <p class="lede">Kroatisch für den Urlaub: Markt, Supermarkt, Küche und Smalltalk. Tippen Sie auf die Begrüßung, um sie zu hören.</p>

  <div class="overall"><div class="progress-line"><span>Gelernt</span><span>${done} von ${total} Karten</span></div>
  <i class="bar"><u style="width:${Math.round(100*done/total)}%"></u></i></div>
  ${dirToggle()}
  <h2 class="sec-title" style="margin-top:20px">Heute</h2>
  <div class="row">
    <button class="btn primary" data-action="review" ${due?'':'disabled'}>Wiederholen: ${due} fällig</button>

  <div class="small" style="margin-top:12px">Neue Karten pro Runde</div>
  <div class="seg" style="margin-top:6px" role="group" aria-label="Neue Karten pro Runde">${[5,10,15,20].map(n => `<button data-action="newn" data-n="${n}" class="${S.newN===n?'on':''}">${n}</button>`).join('')}</div>

  <div class="stack"><button class="btn primary" data-action="next">${last?'Ergebnis ansehen':'Weiter'}</button></div>`:''}`;
}

  };
  inp.addEventListener('input', upd); upd();
}

/* ---------- Aktionen ---------- */
function startDeck(catId, all){
  let pool, title;
  if(catId==='mix'){
    const unknown = ALL.filter(c => !known[c.key]);
    pool = shuffle(unknown.length>=10 ? unknown : ALL).slice(0,10); title = 'Tages-Mix';
  }else{
    const cs = catCards(catId); const unknown = cs.filter(c => !known[c.key]);
    pool = shuffle((!all && unknown.length) ? unknown : cs); title = CATS.find(c => c.id===catId).title;
  }
  S.catId = catId==='mix' ? S.catId : catId;
  S.session = { catId, title, cards:pool, i:0, total:pool.length, got:0, again:0, flipped:false, done:false };
  go('deck');
}
function startSession(catId, title, pool){
  S.session = { catId, title, cards:pool, i:0, total:pool.length, got:0, again:0, flipped:false, done:false };
  go('deck');
}
function startReview(){ startSession('review', 'Wiederholung', shuffle(dueCards().slice(0, 30))); }
function startNew(){ startSession('new', 'Neue Karten', newCards(S.newN)); }
function startQuiz(catId){
  const pool = catId==='all' ? ALL : catCards(catId);
  const hr2de = S.dir==='hr2de';
  const picked = shuffle(pool).slice(0, 10);
  const qs = picked.map(c => {
    const answerOf = x => hr2de ? x.de : x.hr;
    let others = shuffle((pool.length>=4 ? pool : ALL).filter(x => x!==c && answerOf(x)!==answerOf(c)));
    const seen = new Set([answerOf(c)]); const dist = [];
    for(const x of others){ if(!seen.has(answerOf(x))){ seen.add(answerOf(x)); dist.push(x); } if(dist.length===3) break; }
    return { c, opts: shuffle([c, ...dist]) };
  });
  S.catId = catId==='all' ? S.catId : catId;
  S.quiz = { catId, qs, i:0, score:0, answered:null, dir:S.dir, done:false };
  go('quiz');
}

/* ---------- Auto-Modus ---------- */
const AUTO_KEY = 'hr-auto-v1';
function loadAutoSettings(){
  const d = { src:'due', mode:'listen', pause:4, rate:0.85, shuffle:true };
  try{ const p = JSON.parse(localStorage.getItem(AUTO_KEY) || '{}'); if(p && typeof p==='object') return Object.assign(d, p); }catch(e){}
  return d;
}
const A = { active:false, paused:false, token:0, idx:0, list:[], wake:null, errors:0, audio:null, settings:loadAutoSettings() };
function saveAutoSettings(){ try{ localStorage.setItem(AUTO_KEY, JSON.stringify(A.settings)); }catch(e){} }
function autoCards(src){
  if(src==='due') return dueCards();
  if(src==='known') return ALL.filter(c => srs[c.key]);
  if(src==='all') return ALL.slice();
  return catCards(src);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const speechText = t => t.replace(/…/g, ' ').replace(/\s*\/\s*/g, ', ');
function say(text, lang, rate){
  return new Promise(resolve => {
    if(!('speechSynthesis' in window)){ A.errors = 99; resolve(); return; }
    let done = false, timer;
    const fin = () => { if(!done){ done = true; clearTimeout(timer); resolve(); } };
    const u = new SpeechSynthesisUtterance(speechText(text));
    u.lang = lang; u.rate = rate;
    u.onend = () => { A.errors = 0; fin(); };
    u.onerror = e => { if(e && e.error && e.error!=='canceled' && e.error!=='interrupted') A.errors++; fin(); };
    timer = setTimeout(fin, 20000);
    try{ speechSynthesis.speak(u); }catch(e){ A.errors++; fin(); }
  });
}
async function waitMs(ms, token){
  let left = ms;
  while(left > 0 && token === A.token){ await sleep(100); left -= 100; }
}
async function runAuto(token){
  while(token === A.token && A.active && !A.paused){
    const c = A.list[A.idx];
    updateAutoUI();
    const s = A.settings, pm = s.pause * 1000;
    const steps = s.mode==='quiz'
      ? [ {t:c.de, l:'de-DE', p:pm*1.5}, {t:c.hr, l:'hr-HR', p:pm}, {t:c.hr, l:'hr-HR', p:600} ]
      : [ {t:c.hr, l:'hr-HR', p:pm}, {t:c.de, l:'de-DE', p:pm*0.5}, {t:c.hr, l:'hr-HR', p:pm} ];
    for(const st of steps){
      if(token !== A.token) return;
      await say(st.t, st.l, s.rate);
      if(token !== A.token) return;
      if(A.errors >= 3){ stopAuto(); toast('Die Sprachausgabe funktioniert nicht. Bitte die Seite direkt in Chrome öffnen und die Stimmen für Kroatisch und Deutsch installieren.'); return; }
      await waitMs(st.p, token);
    }
    if(token !== A.token) return;
    A.idx++;
    if(A.idx >= A.list.length){ A.idx = 0; if(s.shuffle) A.list = shuffle(A.list); }
  }
}
async function lockScreen(){
  try{
    if('wakeLock' in navigator){
      A.wake = await navigator.wakeLock.request('screen');
      A.wake.addEventListener('release', () => { A.wake = null; updateAutoUI(); });
    }
  }catch(e){ A.wake = null; }
  updateAutoUI();
}
function unlockScreen(){ try{ if(A.wake){ A.wake.release(); } }catch(e){} A.wake = null; }
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='visible' && A.active && !A.paused && !A.wake) lockScreen();
});
function makeSilence(){
  const sr = 8000, n = sr, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i, 128);
  return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
}
function startKeepAlive(){
  try{
    if(!A.audio){ A.audio = new Audio(makeSilence()); A.audio.loop = true; }
    const p = A.audio.play(); if(p && p.catch) p.catch(() => {});
  }catch(e){}
  try{
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title:'Kroatisch Auto-Modus', artist:'Kroatisch für den Urlaub' });
      navigator.mediaSession.setActionHandler('play', () => { if(A.paused) togglePause(); });
      navigator.mediaSession.setActionHandler('pause', () => { if(!A.paused) togglePause(); });
      navigator.mediaSession.setActionHandler('nexttrack', () => skipAuto(1));
      navigator.mediaSession.setActionHandler('previoustrack', () => skipAuto(-1));
      navigator.mediaSession.setActionHandler('stop', () => stopAuto());
    }
  }catch(e){}
}
function stopKeepAlive(){ try{ if(A.audio) A.audio.pause(); }catch(e){} }
let REC = null, recWanted = false, recTest = false, lastCmd = '', lastCmdAt = 0, testTimer = null;
const VOICE_CMDS = [
  ['pause',  ['pause','pausieren','stopp','stop','halt','warte']],
  ['repeat', ['nochmal','nochmals','noch mal','noch einmal','wiederholen','wiederhole','wieder holen']],
  ['back',   ['zurück','zurückgehen','vorherige','vorheriger']],
  ['next',   ['nächste','nächster','nächstes','überspringen','skip']],
  ['go',     ['weiter','los','fortsetzen','weitermachen','start']],
  ['slow',   ['langsamer']],
  ['fast',   ['schneller']],
  ['end',    ['beenden','ende','schluss']]
];
const VOICE_LABEL = { pause:'Pause', go:'Weiter', next:'Nächste Karte', back:'Zurück', repeat:'Nochmal', slow:'Langsamer', fast:'Schneller', end:'Beenden' };
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for(let i=1;i<=m;i++){
    const cur = [i];
    for(let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const vnorm = s => norm(String(s)).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function matchVoice(raw){
  const t = vnorm(raw);
  if(!t) return null;
  const words = t.split(' ');
  if(words.length > 4) return null;
  const compact = words.join('');
  for(const [cmd, list] of VOICE_CMDS){
    for(const p0 of list){
      const p = vnorm(p0), pc = p.replace(/ /g, '');
      if(compact === pc || t === p || t.includes(' ' + p + ' ') || t.startsWith(p + ' ') || t.endsWith(' ' + p)) return cmd;
      if(pc.length >= 6){
        const tol = pc.length >= 9 ? 2 : 1;
        if(lev(compact, pc) <= tol) return cmd;
        if(words.some(w => w.length >= 5 && lev(w, pc) <= tol)) return cmd;
      }
    }
  }
  return null;
}
function voiceMsg(text){
  ['a-voice','v-test'].forEach(id => { const el = document.getElementById(id); if(el) el.textContent = text; });
}
function runVoiceCmd(cmd){
  let msg = VOICE_LABEL[cmd] || null;
  if(cmd==='pause'){ if(!A.paused) togglePause(); }
  else if(cmd==='go'){ if(A.paused){ togglePause(); msg = 'Weiter'; } else { skipAuto(1); msg = 'Nächste Karte'; } }
  else if(cmd==='next'){ skipAuto(1); }
  else if(cmd==='back'){ skipAuto(-1); }
  else if(cmd==='repeat'){ if(A.paused) togglePause(); else skipAuto(0); }
  else if(cmd==='slow' || cmd==='fast'){
    const rates = [0.7, 0.85, 1]; let i = rates.indexOf(A.settings.rate); if(i < 0) i = 1;
    i = Math.max(0, Math.min(2, i + (cmd==='slow' ? -1 : 1)));
    A.settings.rate = rates[i]; saveAutoSettings();
  }
  else if(cmd==='end'){ stopAuto(); }
  return msg;
}
function handleVoice(raw){
  const cmd = matchVoice(raw);
  voiceMsg('🎤 Gehört: „' + raw + '“' + (cmd ? ' → ' + VOICE_LABEL[cmd] : ''));
  if(!cmd) return;
  const now = Date.now();
  if(cmd === lastCmd && now - lastCmdAt < 2500) return;
  lastCmd = cmd; lastCmdAt = now;
  if(recTest){ voiceMsg('🎤 Erkannt: „' + raw + '“ → ' + VOICE_LABEL[cmd] + '. Das funktioniert.'); return; }
  if(!A.active) return;
  runVoiceCmd(cmd);
}
function startVoice(test){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ voiceMsg('🎤 Dieser Browser unterstützt keine Spracherkennung. Bitte Chrome verwenden.'); toast('Spracherkennung wird in diesem Browser nicht unterstützt. Bitte Chrome verwenden.'); return false; }
  stopVoice();
  recTest = !!test;
  try{
    REC = new SR();
    REC.lang = 'de-DE'; REC.continuous = false; REC.interimResults = true; REC.maxAlternatives = 3;
    REC.onstart = () => voiceMsg('🎤 Mikrofon ist an. Sag zum Beispiel „nochmal“.');
    REC.onresult = ev => {
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const r = ev.results[i];
        let used = false;
        for(let k = 0; k < r.length; k++){ if(matchVoice(r[k].transcript)){ handleVoice(r[k].transcript); used = true; break; } }
        if(!used) handleVoice(r[0].transcript);
      }
    };
    REC.onend = () => { if(recWanted){ setTimeout(() => { if(recWanted){ try{ REC.start(); }catch(e){} } }, 250); } };
    REC.onerror = e => {
      const code = e && e.error;
      if(code==='not-allowed' || code==='service-not-allowed'){ recWanted = false; voiceMsg('🎤 Mikrofon nicht erlaubt. In den Chrome-Einstellungen unter Website-Einstellungen das Mikrofon erlauben.'); toast('Mikrofon nicht erlaubt.'); }
      else if(code==='audio-capture'){ voiceMsg('🎤 Kein Mikrofon gefunden oder es wird gerade von einer anderen App benutzt.'); }
      else if(code && code!=='no-speech' && code!=='aborted'){ voiceMsg('🎤 Fehler: ' + code); }
    };
    recWanted = true; REC.start();
    if(test){ clearTimeout(testTimer); testTimer = setTimeout(() => { stopVoice(); voiceMsg('🎤 Test beendet.'); }, 30000); }
    return true;
  }catch(e){ recWanted = false; voiceMsg('🎤 Die Spracherkennung konnte nicht gestartet werden.'); return false; }
}
function stopVoice(){
  recWanted = false; recTest = false; clearTimeout(testTimer);
  try{ if(REC){ REC.onend = null; REC.stop(); } }catch(e){}
  REC = null;
}
async function startAuto(){
  if(!('speechSynthesis' in window)){ toast('In diesem Browser gibt es keine Sprachausgabe. Bitte die Seite direkt in Chrome öffnen.'); return; }
  let list = autoCards(A.settings.src);
  if(!list.length){ toast('In dieser Auswahl gibt es keine Karten. Wähle ein anderes Thema.'); return; }
  if(A.settings.shuffle) list = shuffle(list);
  A.list = list; A.idx = 0; A.active = true; A.paused = false; A.errors = 0; A.token++;
  const tk = A.token;
  render();
  startKeepAlive();
  if(A.settings.voice) startVoice();
  lockScreen();
  runAuto(tk);
}
function togglePause(){
  if(!A.active) return;
  A.token++;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(A.paused){ A.paused = false; lockScreen(); const tk = A.token; setTimeout(() => runAuto(tk), 200); }
  else { A.paused = true; }
  updateAutoUI();
}
function skipAuto(d){
  if(!A.active) return;
  A.token++;
  try{ speechSynthesis.cancel(); }catch(e){}
  A.idx = (A.idx + d + A.list.length) % A.list.length;
  updateAutoUI();
  if(!A.paused){ const tk = A.token; setTimeout(() => runAuto(tk), 250); }
}
function stopAuto(silent){
  const was = A.active;
  A.active = false; A.paused = false; A.token++;
  try{ speechSynthesis.cancel(); }catch(e){}
  unlockScreen(); stopKeepAlive(); stopVoice();
  if(was && !silent) render();
}
function updateAutoUI(){
  const c = A.list[A.idx]; if(!c) return;
  const set = (id, t) => { const el = document.getElementById(id); if(el) el.textContent = t; };
  set('a-hr', c.hr); set('a-de', c.de);
  set('a-count', 'Karte ' + (A.idx+1) + ' von ' + A.list.length);
  set('a-pause', A.paused ? 'Weiter' : 'Pause');
  set('a-lock', A.wake ? 'Bildschirm bleibt an' : 'Bildschirm bitte anlassen');
  try{ if('mediaSession' in navigator) navigator.mediaSession.playbackState = A.paused ? 'paused' : 'playing'; }catch(e){}
}
function viewAuto(){
  if(A.active){
    const c = A.list[A.idx];
    return `<button class="back" data-action="auto-stop">‹ Beenden</button>
    <h2 style="font-size:30px">🚗 Auto-Modus</h2>
    <div class="progress-line"><span id="a-count">Karte ${A.idx+1} von ${A.list.length}</span><span id="a-lock">${A.wake?'Bildschirm bleibt an':'Bildschirm bitte anlassen'}</span></div>
    <div class="flash" style="cursor:default">
      <div class="main" id="a-hr">${esc(c.hr)}</div>
      <div class="back-side"><div class="ans" id="a-de">${esc(c.de)}</div></div>
    </div>
    <div class="stack">
      <button class="btn primary big" id="a-pause" data-action="auto-pause">${A.paused?'Weiter':'Pause'}</button>
      ${A.settings.voice?'<p class="small" id="a-voice" style="margin:0">🎤 Sag: weiter, zurück, pause, nochmal, langsamer, beenden</p>':''}
      <div class="two" style="margin-top:0">
        <button class="btn big" data-action="auto-prev">Zurück</button>
        <button class="btn big" data-action="auto-next">Nächste</button>
      </div>
    </div>`;
  }
  const s = A.settings;
  const srcOpts = [['due','Fällige Karten (Wiederholung)'],['known','Alle schon gelernten Karten'],['all','Alle Karten gemischt']].concat(CATS.map(c => [c.id, c.icon + ' ' + c.title]));
  const opt = (arr, cur) => arr.map(a => `<option value="${esc(a[0])}" ${String(cur)===String(a[0])?'selected':''}>${esc(a[1])}</option>`).join('');
  const n = autoCards(s.src).length;
  return `<button class="back" data-action="home">‹ Zurück</button>
  <h2 style="font-size:34px">🚗 Auto-Modus</h2>
  <div class="tip"><b>Wichtig:</b> Stell alles im Stand ein und starte vor der Fahrt. Bedien das Handy nicht beim Fahren. Am besten hängt es am Ladekabel.</div>
  <label class="field"><span>Was soll vorgelesen werden?</span><select data-auto="src">${opt(srcOpts, s.src)}</select></label>
  <p class="small" style="margin:6px 0 0">${n} Karten in dieser Auswahl.</p>
  <label class="field"><span>Ablauf</span><select data-auto="mode">${opt([['listen','Hören: Kroatisch, Deutsch, Kroatisch'],['quiz','Abfragen: Deutsch, Pause zum Antworten, Kroatisch']], s.mode)}</select></label>
  <label class="field"><span>Pausen zum Nachsprechen</span><select data-auto="pause">${opt([[2,'Kurz (2 Sekunden)'],[4,'Mittel (4 Sekunden)'],[6,'Lang (6 Sekunden)']], s.pause)}</select></label>
  <label class="field"><span>Sprechtempo</span><select data-auto="rate">${opt([[0.7,'Langsam'],[0.85,'Normal'],[1,'Schnell']], s.rate)}</select></label>
  <label class="check"><input type="checkbox" data-auto="shuffle" ${s.shuffle?'checked':''}> Zufällige Reihenfolge</label>
  <label class="check"><input type="checkbox" data-auto="voice" ${s.voice?'checked':''}> Sprachsteuerung per Mikrofon (weiter, zurück, pause …)</label>
  <p class="small" style="margin:0">Die Sprachsteuerung braucht Mikrofon-Erlaubnis und Internet. Auf manchen Handys piept sie beim Neustart oder macht die Musik leiser. Teste das vor der Fahrt.</p>
  <div class="stack" style="margin-top:8px"><button class="btn" data-action="voice-test">🎤 Mikrofon testen (30 Sekunden)</button></div>
  <p class="small" id="v-test" style="margin:6px 0 0"></p>
  <div class="stack"><button class="btn primary big" data-action="auto-start">Start</button></div>
  <p class="small" style="margin-top:14px">Das Zuhören ändert deinen Lernfortschritt nicht. Du brauchst auf dem Handy eine kroatische und eine deutsche Stimme. Am zuverlässigsten läuft es direkt in Chrome und mit eingeschaltetem Bildschirm.</p>`;
}
app.addEventListener('change', e => {
  const el = e.target.closest('[data-auto]'); if(!el) return;
  const k = el.dataset.auto;
  if(k==='shuffle' || k==='voice') A.settings[k] = el.checked;
  else if(k==='pause' || k==='rate') A.settings[k] = parseFloat(el.value);
  else A.settings[k] = el.value;
  saveAutoSettings();
  if(k==='src') render(false);
});

const actions = {
  speak: el => speak(el.dataset.text),
  home: () => go('home'),
  'open-cat': el => { S.catId = el.dataset.id; go('cat'); },
  'open-cat-back': () => go('cat'),
  'back-cat': () => { if(S.session && ['mix','review','new'].includes(S.session.catId)) go('home'); else go('cat'); },
  dir: el => { S.dir = el.dataset.dir; render(false); },
  mix: () => startDeck('mix'),
  review: () => startReview(),
  'auto-open': () => go('auto'),
  'auto-start': () => startAuto(),
  'auto-stop': () => stopAuto(),
  'auto-pause': () => togglePause(),
  'auto-next': () => skipAuto(1),
  'auto-prev': () => skipAuto(-1),
  'voice-test': () => { if(recWanted && recTest){ stopVoice(); voiceMsg('🎤 Test beendet.'); } else { startVoice(true); } },
  new: () => startNew(),
  newn: el => { S.newN = +el.dataset.n; try{ localStorage.setItem('hr-newn', String(S.newN)); }catch(e){} render(false); },
  'deck-start': el => startDeck(el.dataset.id, !!el.dataset.all),
  'quiz-start': el => startQuiz(el.dataset.id),
  flip: () => { S.session.flipped = !S.session.flipped; render(false); },
  again: () => {
    const D = S.session, c = D.cards.splice(D.i,1)[0];
    lapse(c, false); D.again++;
    D.cards.splice(Math.min(D.i+3, D.cards.length), 0, c);
    D.flipped = false; render(false);
  },
  got: () => {
    const D = S.session, c = D.cards[D.i];
    learn(c); D.got++; D.i++; D.flipped = false;
    if(D.i >= D.cards.length) D.done = true;
    render(true);
  },
  answer: el => {
    const Q = S.quiz; if(Q.answered!==null) return;
    const q = Q.qs[Q.i], idx = +el.dataset.i; Q.answered = idx;
    if(q.opts[idx]===q.c){ Q.score++; } else { lapse(q.c, true); }
    speak(q.c.hr); render(false);
  },
  next: () => {
    const Q = S.quiz; Q.i++; Q.answered = null;
    if(Q.i >= Q.qs.length) Q.done = true;
    render(true);
  },
  'reset-cat': el => {
    catCards(el.dataset.id).forEach(c => { delete srs[c.key]; }); save(); render(false);
  },
  dialogs: () => go('dialogs'),
  'open-dlg': el => { S.dlgId = el.dataset.id; go('dialog'); },
  'dlg-all': () => { const d = DIALOGS.find(x => x.id===S.dlgId); speakAll(d.lines.map(l => l[1])); },
  'dlg-stop': () => { try{ speechSynthesis.cancel(); }catch(e){} },
  'dlg-de': () => { S.showDe = !S.showDe; render(false); }
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el || !app.contains(el)) return;
  const fn = actions[el.dataset.action]; if(fn) fn(el, e);
});
app.addEventListener('keydown', e => {
  if((e.key==='Enter' || e.key===' ') && e.target.matches('[role="button"]')){
    e.preventDefault(); e.target.click();
  }
});
nav.addEventListener('click', e => {
  const b = e.target.closest('button[data-nav]'); if(!b) return;
  stopAuto(true);
  try{ speechSynthesis.cancel(); }catch(err){}
  go(b.dataset.nav);
});

render();
</script>
